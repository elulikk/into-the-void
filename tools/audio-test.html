<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de audio de la nave</title>
<style>
  body { background:#0b0e14; color:#d6dbe6; font:15px system-ui,sans-serif; max-width:560px; margin:24px auto; padding:0 16px; }
  h1 { font-size:18px; }
  .row { display:grid; grid-template-columns:130px 1fr 48px; align-items:center; gap:10px; margin:10px 0; }
  .row.chk { grid-template-columns:130px 1fr; }
  input[type=range] { width:100%; }
  output { text-align:right; font-variant-numeric:tabular-nums; color:#8fa3c8; }
  button { background:#2a4a8a; color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; margin:0 6px 6px 0; }
  button:hover { background:#3560ad; }
  #status { color:#8fa3c8; margin:8px 0 16px; }
</style>
</head>
<body>
<h1>Prueba de audio de la nave</h1>
<div id="status">Pulsá "Iniciar audio" (el navegador exige un clic).</div>
<div>
  <button id="start">Iniciar audio</button>
  <label><input type="checkbox" id="mute"> Silenciar</label>
</div>
<div style="margin:12px 0">
  <button data-p="idle">Reposo</button>
  <button data-p="cruise1">Crucero</button>
  <button data-p="boost">Boost</button>
  <button data-p="charge">Carga supercrucero</button>
  <button data-p="atmo">Atmósfera</button>
</div>
<div id="controls"></div>
<script type="module">
import { ShipAudio } from '../src/audio.js';

const audio = new ShipAudio();
const state = { throttle:0, speed01:0, boost:0, cruiseCharge:0, cruiseActive:false, turnRate:0, rcs:0, atmoDensity:0 };
const ids = Object.keys(state);
const box = document.getElementById('controls');
const inputs = {};

for (const k of ids) {
  const row = document.createElement('div');
  row.className = 'row' + (k === 'cruiseActive' ? ' chk' : '');
  const label = document.createElement('label'); label.textContent = k;
  let input, out;
  if (k === 'cruiseActive') {
    input = document.createElement('input'); input.type = 'checkbox';
    input.addEventListener('change', () => state[k] = input.checked);
    row.append(label, input);
  } else {
    input = document.createElement('input'); input.type = 'range';
    input.min = 0; input.max = 1; input.step = 0.01; input.value = 0;
    out = document.createElement('output'); out.textContent = '0.00';
    input.addEventListener('input', () => { state[k] = +input.value; out.textContent = (+input.value).toFixed(2); });
    row.append(label, input, out);
  }
  inputs[k] = { input, out };
  box.append(row);
}

function setState(s) {
  Object.assign(state, s);
  for (const k of ids) {
    const { input, out } = inputs[k];
    if (k === 'cruiseActive') input.checked = state[k];
    else { input.value = state[k]; out.textContent = state[k].toFixed(2); }
  }
}
const presets = {
  idle:   { throttle:0, speed01:0, boost:0, cruiseCharge:0, cruiseActive:false, turnRate:0, rcs:0, atmoDensity:0 },
  cruise1:{ throttle:0.7, speed01:0.6, boost:0, cruiseCharge:0, cruiseActive:false, turnRate:0.2, rcs:0, atmoDensity:0 },
  boost:  { throttle:1, speed01:0.9, boost:1, cruiseCharge:0, cruiseActive:false, turnRate:0, rcs:0, atmoDensity:0 },
  charge: { throttle:1, speed01:0.8, boost:0, cruiseCharge:0.7, cruiseActive:false, turnRate:0, rcs:0, atmoDensity:0 },
  atmo:   { throttle:0.6, speed01:0.7, boost:0, cruiseCharge:0, cruiseActive:false, turnRate:0.3, rcs:0.3, atmoDensity:0.8 },
};
document.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => setState(presets[b.dataset.p])));

const status = document.getElementById('status');
document.getElementById('start').addEventListener('click', () => {
  audio.resume();
  status.textContent = 'Audio activo (' + (audio.ctx ? audio.ctx.state : 'sin soporte') + '). Mové los sliders.';
});
document.getElementById('mute').addEventListener('change', e => audio.setMuted(e.target.checked));

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  audio.update(state, dt);
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
